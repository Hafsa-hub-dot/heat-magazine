<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ما وراء الحرارة | حفصة طيبي | الصف العاشر</title><link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@400;500;600;700&family=Marhey:wght@400;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Markazi Text',Georgia,serif;background:#e8e5df;color:#243447;display:flex;flex-direction:column}
header{height:48px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:4px 3%;gap:8px;border-bottom:1px solid #ddd}
header strong{font-size:22px}header span{font-size:17px}
button{font:600 20px 'Markazi Text',serif;cursor:pointer}
header button,.nav button,.action{border:1px solid #d3c6b4;background:#fff;border-radius:9px;padding:4px 13px;color:#26394b}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px;perspective:1700px;overflow:hidden}
.book{position:relative;width:min(1100px,97vw);height:100%;background:#fffdf9;transform-style:preserve-3d;box-shadow:11px 13px 0 -7px #b9ac9a,16px 19px 0 -10px #a59a89,25px 25px 45px #0003;transform:rotateX(2deg)}
.page{position:absolute;inset:0;background:#fffdf9;overflow:hidden;padding:clamp(14px,2.8vh,30px) clamp(17px,3.5vw,43px);display:none;transform-origin:right center;backface-visibility:hidden}
.page.active{display:flex;flex-direction:column}
.kicker{font:700 clamp(10px,1.6vh,14px) Arial;color:#a17843;letter-spacing:.8px}
h1{font:600 clamp(33px,7vh,69px) Marhey,serif;margin:3px 0}
h2{font-size:clamp(25px,4.5vh,45px);line-height:1.08;margin:5px 0}
p{font-size:clamp(17px,2.8vh,27px);line-height:1.23;margin:5px 0}
.home{background:linear-gradient(125deg,#fffdf9,#f6f1e8)}
.homehead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.homehead p{font-size:clamp(15px,2.4vh,23px)}
.tiles{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(5px,1.4vh,14px);margin:8px 0}
.tile{border:1px solid #dcd3c5;background:#fff;overflow:hidden;border-radius:12px;text-align:right;padding:0;display:flex;flex-direction:column;min-height:0}
.photo{position:relative;display:block;flex:1;min-height:0;background:linear-gradient(120deg,#e3ddd1,#b9c7c8);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:linear-gradient(125deg,#dce8eb,#e6e0d6);font-size:clamp(15px,2.6vh,27px);color:#44525a;padding:10px}
.tile .caption{padding:5px 10px;min-height:clamp(47px,9vh,79px)}
.tile strong{font-size:clamp(16px,2.7vh,27px);line-height:1;display:block}
.tile small{font-size:clamp(12px,1.8vh,17px);color:#88745e}
.readbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,30px);align-items:stretch}
.readbody .photo{border-radius:9px;min-height:0}
.story{display:flex;flex-direction:column;justify-content:center;min-height:0}
.story p{font-size:clamp(17px,2.75vh,27px)}
.data{border-collapse:collapse;width:100%;font-size:clamp(12px,2.2vh,21px);margin:8px 0}
.data td,.data th{border-bottom:1px solid #ded7cc;padding:clamp(2px,.7vh,7px);text-align:center}
.data tr:first-child{background:#f0ebe2;font-weight:bold}
.qhead{display:flex;align-items:center;justify-content:space-between}
.prompt{font-size:clamp(22px,4.2vh,42px);font-weight:700;line-height:1.1;margin:clamp(6px,1.5vh,15px) 0}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(5px,1vh,11px);flex:1;min-height:0;align-content:center}
.option{display:flex;align-items:center;gap:8px;text-align:right;background:#fff;border:1px solid #d8d1c5;border-radius:11px;padding:clamp(5px,1vh,12px);font-size:clamp(16px,2.6vh,26px);line-height:1.05;min-height:0}
.option.selected{border:2px solid #ae7d45;background:#faf1e4}
.option b{font:700 clamp(12px,2vh,19px) Arial;background:#efe8df;display:grid;place-items:center;border-radius:7px;width:28px;height:28px;flex-shrink:0}
.qfooter{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.action{background:#24394c;color:white;border:0}
.essay{flex:1;width:100%;min-height:0;resize:none;border:1px solid #cfc4b5;border-radius:12px;padding:15px;font:clamp(19px,3vh,29px) 'Markazi Text',serif;outline-color:#ad8654}
.nav{height:49px;display:flex;justify-content:center;align-items:center;gap:18px;background:#fff}
.nav button{background:#24394c;color:white;border:0}
.nav button:disabled{opacity:.35}
.corner{position:absolute;left:0;bottom:0;width:clamp(46px,9vw,95px);height:clamp(46px,9vw,95px);z-index:4;touch-action:none;cursor:grab;background:linear-gradient(45deg,#d9c8aa 0 25%,transparent 26%);clip-path:polygon(0 0,100% 100%,0 100%);opacity:.75}
.corner:after{content:'اسحبي';position:absolute;bottom:5px;left:3px;font-size:13px;color:#4b3c2c;transform:rotate(-32deg)}
.flip{position:absolute;inset:0;background:#f9f5ed;pointer-events:none;z-index:5;display:none;transform-origin:right center;box-shadow:-15px 0 25px #0003;backface-visibility:visible}
.flip.on{display:block}
.flip:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#b4a48e55,transparent 35%,#fff8 70%,#aa9b8655)}
.modal{position:fixed;inset:0;background:#162331bb;display:none;z-index:20;align-items:center;justify-content:center;padding:3vh 4vw}
.modal.on{display:flex}
.dialog{width:min(1000px,95vw);height:min(90vh,850px);background:#fffdf9;border-radius:16px;padding:clamp(15px,3vh,30px);display:flex;flex-direction:column;gap:8px;box-shadow:0 25px 80px #0005}
.dialog .storytext{flex:1;min-height:0;overflow:auto;columns:2;column-gap:26px}
.dialog .storytext p{break-inside:avoid;font-size:clamp(18px,2.7vh,27px)}
.finish{align-items:center;justify-content:center;text-align:center}
.finish h2{font-size:clamp(37px,7vh,68px)}
@media(max-width:650px){header strong{font-size:17px}header span{font-size:12px}.readbody{grid-template-columns:1fr;grid-template-rows:28% 1fr}.story p{font-size:clamp(17px,2.6vh,24px)}.tiles{gap:5px}.tile strong{font-size:clamp(13px,2.2vh,20px)}.tile .caption{padding:3px 5px;min-height:45px}.options{grid-template-columns:1fr}.option{font-size:clamp(15px,2.35vh,22px)}.dialog .storytext{columns:1}}

.cover{padding:0!important;background:#152b35!important;color:white;isolation:isolate}
.cover-photo{position:absolute;inset:0;background-image:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1800&q=90');background-position:center;background-size:cover;z-index:-2}
.cover-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,24,34,.88),rgba(10,36,46,.53) 65%,rgba(11,39,47,.16));z-index:-1}
.cover-content{height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,5vh,55px) clamp(23px,5vw,70px);text-shadow:0 2px 15px #0007}
.cover-edition{font:600 clamp(12px,2vh,19px) Arial,sans-serif;letter-spacing:.2px}
.cover-rule{height:5px;width:80px;background:#e5b778;margin-bottom:16px}
.cover-small{font-size:clamp(18px,3vh,31px)}
.cover-main h1{font-family:'Marhey',serif;font-size:clamp(52px,11vh,110px);line-height:1.24;color:white;margin:7px 0}
.cover-main p{font-size:clamp(18px,3vh,31px)}
.cover-credit{font-size:clamp(19px,3vh,30px);line-height:1.15}
.cover-open{position:absolute;bottom:clamp(18px,4vh,40px);left:clamp(18px,4vw,50px);border:1px solid #fff9;background:#fffef0;color:#233849;border-radius:12px;padding:8px 19px;z-index:2}

.student-form{display:grid;gap:clamp(7px,2vh,20px);width:min(540px,90%);margin:10px auto}.student-form label{display:flex;flex-direction:column;text-align:right;font-size:clamp(17px,3vh,27px)}.student-form input{border:1px solid #cbbca8;border-radius:8px;padding:9px 12px;font:22px 'Markazi Text',serif;min-width:0}.finish-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0}.finish-actions button{font-size:clamp(16px,2.7vh,24px)}
.photo-empty{background:linear-gradient(120deg,#a4c2cc,#e4e7df 55%,#b6b0a6)}.photo-tint{pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,#00000008,transparent)} </style></head><body><header><strong>ما وراء الحرارة | مجلة الفيزياء العلمية</strong><span>المعلمة حفصة طيبي • الصف العاشر</span><button onclick="go(1)">فهرس النصوص</button></header><main class="stage"><div class="book" id="book"></div></main><div class="nav"><button id="prev">الصفحة السابقة</button><span id="counter"></span><button id="next">الصفحة التالية</button></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="qhead"><h2 id="modalTitle"></h2><button class="action" onclick="closeModal()">إغلاق والعودة للسؤال</button></div><div id="modalBody" class="storytext"></div></div></div><script>
const units=[
{title:'لماذا تسخن الرمال أسرع من البحر؟',sub:'تحقيق على شاطئ قطر',img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1300',paragraphs:[`في يوم صيفي مشمس، لاحظت مهند أن الرمال القريبة من الشاطئ ساخنة جدًا، بينما كانت مياه البحر أقل سخونة. تساءلت: إذا كانت أشعة الشمس تصل إلى كليهما، فلماذا تختلف الاستجابة الحرارية؟ قررت ألا تكتفي بالانطباع، لأن درجة الحرارة تتأثر بخصائص المادة وظروف انتقال الطاقة.`,`في مختبر المدرسة، وضعت مهند 0.50 kg من الماء و0.50 kg من الرمل في وعاءين متماثلين ومعزولين تقريبًا. كانت درجة الحرارة الابتدائية لكل منهما 25°C، ثم زوّدت كل عينة بـ4200 J من الطاقة الحرارية. استُخدمت قيم تقريبية للحرارة النوعية: الماء 4200 J/(kg·°C)، والرمل 800 J/(kg·°C).`,`تعني الحرارة النوعية مقدار الطاقة اللازمة لرفع درجة حرارة كيلوغرام واحد من مادة بمقدار درجة سلسيوس واحدة. أما السعة الحرارية للجسم كله فتساوي حاصل ضرب كتلته في حرارته النوعية: C=mc. وتُحسب الطاقة الحرارية المكتسبة أو المفقودة دون تغير الحالة من العلاقة Q=mcΔT.`,`قالت إحدى الطالبات: «الماء لم يكتسب الطاقة كلها؛ لهذا لم يسخن». اعترضت مهند: «المعطيات تقول إن الطاقة المكتسبة متساوية، ولكن السعة الحرارية ليست متساوية». وأشارت المعلمة إلى أن تجربة المختبر مبسطة؛ ففي الشاطئ الحقيقي تتدخل الرياح والتبخر والتيارات المائية وعمق الماء.`],table:[['العينة','الكتلة','الحرارة النوعية','الطاقة المكتسبة'],['الماء','0.50 kg','4200 J/kg·°C','4200 J'],['الرمل','0.50 kg','800 J/kg·°C','4200 J']],qs:[['استخراج أدلة','حددي ثلاثة متغيرات ضُبطت في التجربة.','الكتلة ودرجة الحرارة الابتدائية والطاقة الحرارية المكتسبة.'],['تطبيق','احسبي السعة الحرارية لكل عينة.','الماء 2100 J/°C، والرمل 400 J/°C.'],['حل مشكلة','احسبي درجة الحرارة النهائية للماء والرمل.','الماء 27°C، والرمل 35.5°C.'],['تفكير ناقد','قيّمي ادعاء أن الماء لم يكتسب الطاقة كلها.','غير مدعوم بالمعطيات؛ كلاهما اكتسب 4200 J، والفرق في السعة الحرارية.'],['استدلال','لو تضاعفت كتلة الرمل وبقيت الطاقة نفسها، كم تصبح الزيادة في حرارته؟','5.25°C.'],['تصميم تجربة','اقترحي تعديلًا يجعل قياس الحرارة النوعية أدق.','استخدام عزل جيد، وقياس الطاقة المنتقلة فعليًا، وتقليب العينة وقياس الحرارة بمستشعر معاير.'],['تفسير بيانات','لماذا لا تكفي تجربة الوعاءين لتفسير جميع ظواهر الشاطئ؟','لأن التبخر وحركة المياه والرياح والإشعاع وعمق الماء تؤثر أيضًا.'],['اتخاذ قرار','اختاري بين الماء والرمل لتخزين طاقة حرارية كبيرة دون ارتفاع شديد في الحرارة، وبرري.','الماء؛ لأن سعته الحرارية عند الكتلة نفسها أكبر.']]},
{title:'مكعب الثلج الذي لم ترتفع حرارته',sub:'الحرارة الكامنة للانصهار',img:'https://images.unsplash.com/photo-1543255006-d6395b6f1171?w=1300',paragraphs:[`في مختبر التبريد، وضعت الباحثة قطعة ثلج نقية كتلتها 0.20 kg عند درجة 0°C في وعاء معزول تقريبًا. زوّد السخان العينة بالطاقة، لكن المستشعر ظل يعرض 0°C خلال جزء من التجربة. بدا الأمر متناقضًا: كيف تُضاف طاقة ولا ترتفع درجة الحرارة؟`,`خلال الانصهار عند الضغط الثابت، تستخدم الطاقة المضافة في تغيير ترتيب الجزيئات وزيادة طاقة الوضع المرتبطة بها، لا في رفع متوسط طاقتها الحركية. لذلك تبقى درجة حرارة خليط الثلج والماء عند درجة الانصهار حتى يكتمل التحول، في الظروف المثالية.`,`تُسمّى الطاقة اللازمة لتغيير الحالة دون تغير درجة الحرارة «الحرارة الكامنة». ولانصهار الثلج نستخدم Q=mL_f، حيث L_f≈334000 J/kg. وبعد اكتمال الانصهار، تؤدي الطاقة الإضافية إلى ارتفاع درجة حرارة الماء وفق Q=mcΔT، وباعتبار الحرارة النوعية للماء 4200 J/(kg·°C).`,`اقترحت طالبة زيادة قدرة السخان إلى الضعف، معتقدة أن درجة الانصهار ستصبح أعلى. أوضحت الباحثة أن زيادة القدرة، عند ثبات الظروف، تُسرّع الانصهار ولا تغيّر درجة الانصهار نفسها.`],table:[['الكمية','القيمة'],['كتلة الثلج','0.20 kg'],['درجة البداية','0°C'],['الحرارة الكامنة النوعية للانصهار','334000 J/kg'],['قدرة السخان المثالية','100 W']],qs:[['فهم علمي','لماذا لا ترتفع درجة الحرارة أثناء انصهار الثلج؟','تذهب الطاقة لتغيير الحالة وزيادة طاقة الوضع الداخلية لا متوسط الطاقة الحركية.'],['حساب','احسبي الطاقة اللازمة لصهر الثلج بالكامل.','Q=0.20×334000=66800 J.'],['تطبيق','كم ثانية يستغرق الانصهار عند قدرة 100 W مع إهمال الفقد؟','t=66800/100=668 s، أي نحو 11.1 دقيقة.'],['تفكير ناقد','هل رفع قدرة السخان إلى 200 W يرفع درجة انصهار الثلج؟','لا، يقل زمن الانصهار إلى النصف تقريبًا مع بقاء درجة الانصهار 0°C عند الضغط نفسه.'],['استدلال','إذا انصهر نصف الثلج فقط، فما الطاقة التي استُخدمت؟','33400 J.'],['تطبيق مركب','بعد الانصهار، كم طاقة إضافية لرفع الماء الناتج إلى 10°C؟','Q=0.20×4200×10=8400 J.'],['تقييم فرضية','هل يكفي ثبات درجة الحرارة لإثبات أن العينة لا تستقبل طاقة؟','لا؛ قد تستقبل طاقة كامنة أثناء تغير الحالة.'],['ابتكار','صممي طريقة عملية للتحقق من ثبات الحرارة أثناء الانصهار.','تسجيل الحرارة والزمن بمستشعر أثناء التسخين المنتظم مع تحريك لطيف وتقليل الفقد.']]},
{title:'ثلاثة مقاييس وقراءة واحدة',sub:'ملف من مختبر دولي',img:'https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=1300',paragraphs:[`استقبل مختبر دولي تقارير لدرجات الحرارة من ثلاث محطات تستخدم سلسيوس وكلفن وفهرنهايت. كتب التقرير الأول 25°C، والثاني 298.15 K، والثالث 77°F. ظنّ أحد الفنيين أن المحطات تختلف، لأن الأرقام غير متساوية.`,`تختلف نقطة الصفر وحجم التدريج بين المقاييس. العلاقة بين سلسيوس وكلفن هي K=°C+273.15، أما فهرنهايت فيُحسب من F=(9/5)C+32. درجة الصفر المطلق تساوي 0 K، أي −273.15°C، ولا تُكتب علامة الدرجة مع الكلفن.`,`في تقرير لاحق، وردت قراءة −300°C لمادة عادية. أثارت القراءة شكوك فريق الجودة لأنها أقل من الصفر المطلق، وهي غير ممكنة بوصفها درجة حرارة ترموديناميكية. كما ظهرت عبارة «زاد الجسم 10°C أي 10°F»، وهو استنتاج آخر خاطئ لأن فروق درجات الحرارة لا تتطابق عددياً بين المقياسين.`,`طُلب من الفريق إعداد دليل يمنع أخطاء وحدات القياس قبل مشاركة البيانات مع مختبرات أخرى.`],table:[['المحطة','القراءة'],['أ','25°C'],['ب','298.15 K'],['ج','77°F'],['د','−300°C']],qs:[['مقارنة','هل المحطات أ وب وج متفقة؟ برري بالتحويل.','نعم؛ جميعها تساوي 25°C.'],['حساب','حوّلي 40°C إلى K و°F.','313.15 K و104°F.'],['تحقق','ما الخطأ العلمي في قراءة −300°C؟','أقل من الصفر المطلق −273.15°C.'],['تفكير ناقد','فنّدي عبارة أن زيادة 10°C تساوي زيادة 10°F.','فرق 10°C يعادل فرق 18°F.'],['دقة علمية','أي التعبيرين أصح: 300°K أم 300 K؟','300 K؛ الكلفن بلا علامة درجة.'],['تطبيق','حوّلي 14°F إلى °C.','(14−32)×5/9=−10°C.'],['استدلال','إذا زادت حرارة عينة من 280 K إلى 300 K، فما مقدار التغير بالسلسيوس؟','20°C؛ مقدار فرق الكلفن يساوي مقدار فرق السلسيوس.'],['ابتكار','ضعي قاعدة تحقق آلي لرفض قراءات غير منطقية.','توحيد الوحدات إلى K ورفض القيم السالبة بالكلفن والتنبيه عند غياب الوحدة.']]},
{title:'السر الذي كشفه منحنى التجمد',sub:'قراءة بيانات لا تخمينات',img:'https://images.unsplash.com/photo-1437482078695-73f5ca6c96e2?w=1300',paragraphs:[`سجّلت مجموعة بحثية درجة حرارة عينة من الماء النقي أثناء تبريدها في ظروف مثالية عند الضغط الجوي المعتاد. انخفضت الحرارة أولًا من 20°C إلى 0°C، ثم استقرت عند الصفر عدة دقائق، قبل أن تنخفض مجددًا بعد تجمد العينة كلها.`,`الجزء الأفقي في المنحنى لا يعني توقف فقدان الطاقة؛ بل يشير إلى تحول السائل إلى صلب مع تحرير الحرارة الكامنة للتجمد. وخلال هذا الجزء يمكن أن يوجد الماء والثلج معًا. بعد اكتمال التجمد تبدأ حرارة الثلج في الانخفاض.`,`تُظهر البيانات المبسطة التالية الزمن بالدقائق ودرجة الحرارة بالسلسيوس. وهي نموذج مثالي للتعلم، وقد تختلف المنحنيات الفعلية بسبب التبريد الفائق أو ظروف القياس.`,`قالت طالبة: «ما دام الرسم أفقيًا، فلا يوجد تغير في الطاقة الداخلية». بينما قالت أخرى: «تتغير الطاقة الداخلية حتى لو ثبتت درجة الحرارة».`],table:[['الزمن (دقيقة)','0','2','4','6','8','10','12'],['درجة الحرارة (°C)','20','10','0','0','0','−10','−20']],qs:[['قراءة رسم','في أي فترة يظهر الجزء الأفقي؟','من الدقيقة 4 إلى الدقيقة 8.'],['تفسير','ما الحالة الفيزيائية للمادة أثناء الجزء الأفقي؟','خليط من الماء السائل والثلج أثناء التجمد.'],['تفكير ناقد','أي رأي الطالبتين أصح؟','الثانية؛ تنخفض الطاقة الداخلية بتحرر الحرارة الكامنة.'],['حساب','احسبي معدل تغير الحرارة بين الدقيقتين 0 و4.','(0−20)/(4−0)=−5°C/min.'],['استدلال','ماذا يحدث بعد الدقيقة 8؟','يكتمل التجمد ويبدأ الثلج بالتبرد.'],['تنبؤ','إذا زادت سرعة سحب الطاقة، كيف يتغير زمن الجزء الأفقي تقريبًا؟','يقصر الزمن إذا ظلت الكتلة والظروف الأخرى ثابتة.'],['تقييم','هل يمكن اعتبار كل جزء أفقي في أي رسم تجمدًا حتمًا؟','لا؛ يجب معرفة سياق التجربة وحالة المادة واتجاه انتقال الطاقة.'],['إبداع','اقترحي طريقة لعرض البيانات تسهل تحديد فترة التجمد.','رسم درجة الحرارة مقابل الزمن وتلوين فترة الثبات مع تعليق يفسر التحول.']]},
{title:'لماذا يحرق البخار أكثر؟',sub:'طاقة لا نراها في قراءة المقياس',img:'https://images.unsplash.com/photo-1485808191679-5f86510681a2?w=1300',paragraphs:[`في مطبخ تجريبي، لاحظت باحثة أن التعرض لبخار ماء عند 100°C قد يسبب حروقًا أشد من التعرض لكمية مماثلة من الماء السائل عند 100°C، إذا تكاثف البخار على الجلد. لكن المقارنة لا تعتمد على درجة الحرارة وحدها؛ بل على كتلة المادة والطاقة المنتقلة وزمن التلامس.`,`عندما يتكاثف البخار إلى ماء عند درجة الحرارة نفسها، يطلق طاقة كامنة كبيرة. وتبلغ الحرارة الكامنة النوعية لتبخر الماء تقريبًا 2.26×10⁶ J/kg عند 100°C والضغط الجوي المعتاد. ثم قد يبرد الماء المتكاثف، مطلقًا طاقة إضافية.`,`لذلك يجب التفريق بين انتقال الطاقة بسبب تغير درجة الحرارة Q=mcΔT وانتقالها أثناء تغير الحالة Q=mL_v. في نموذج حسابي، نفترض تكاثف 0.010 kg من البخار عند 100°C ثم تبريد الماء الناتج إلى 40°C، مع إهمال الفقد.`,`أثار التقرير سؤالًا نقديًا: هل كل بخار أشد خطرًا دائمًا من كل ماء ساخن؟ الجواب يحتاج إلى مقارنة ظروف التعرض بدل إصدار حكم مطلق.`],table:[['المعطى','القيمة'],['كتلة البخار','0.010 kg'],['درجة البخار','100°C'],['درجة النهاية','40°C'],['Lᵥ','2.26×10⁶ J/kg'],['c للماء','4200 J/kg·°C']],qs:[['فهم','ما الفرق بين التكاثف والتبريد؟','التكاثف تغير حالة يطلق حرارة كامنة؛ التبريد انخفاض درجة حرارة.'],['حساب','احسبي الطاقة المنطلقة عند تكاثف البخار.','22600 J.'],['حساب','احسبي الطاقة المنطلقة عند تبريد الماء المتكاثف إلى 40°C.','0.010×4200×60=2520 J.'],['تطبيق مركب','ما مجموع الطاقة المنطلقة في النموذج؟','25120 J.'],['مقارنة','أي المرحلتين تطلق طاقة أكبر؟','التكاثف؛ 22600 J مقابل 2520 J.'],['تفكير ناقد','لماذا لا يكفي القول إن البخار والماء لهما درجة الحرارة نفسها لتساوي خطورتهما؟','لأن البخار يطلق طاقة كامنة إضافية عند التكاثف.'],['تقييم','هل كل تعرض للبخار أخطر من كل تعرض للماء الساخن؟','لا؛ يعتمد على الكتلة والمدة ودرجة الحرارة والتلامس وظروف انتقال الطاقة.'],['ابتكار','اقترحي تنبيهًا علميًا قصيرًا للسلامة في المختبر.','احذري البخار: قد يطلق حرارة كامنة كبيرة عند تكاثفه حتى لو كانت حرارته مساوية للماء المغلي.']]},
{title:'مهمة إنقاذ الشحنة الحساسة',sub:'قرار هندسي مبني على الفيزياء',img:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1300',paragraphs:[`تعطلت وحدة تبريد حافظة نقل تحتوي على مادة حساسة للحرارة. كان على الفريق اختيار طريقة مؤقتة لتقليل ارتفاع درجة الحرارة. أمامه خياران: وضع ماء بارد فقط، أو وضع ثلج عند 0°C داخل حاوية محكمة منفصلة عن الشحنة. جميع القيم التالية مبسطة لأغراض المسألة ولا تمثل توصيات لنقل أدوية فعلية.`,`تسمح كتلة من الثلج بامتصاص طاقة أثناء الانصهار دون ارتفاع درجة حرارتها ما دام الثلج والماء في حالة اتزان عند 0°C. أما الماء السائل وحده فيكتسب الطاقة بارتفاع حرارته وفق Q=mcΔT. لكن كفاءة أي حافظة تعتمد أيضًا على العزل والتسرب الحراري وتوزيع درجة الحرارة.`,`أُعطي الفريق خياران متساويا الكتلة: 0.50 kg من الثلج عند 0°C، أو 0.50 kg من الماء عند 0°C. يفترض أن تصل كل مادة في النهاية إلى 10°C، وأن تُهمل طاقة الحافظة وفقد الطاقة. استخدمي L_f=334000 J/kg وc=4200 J/(kg·°C).`,`لاحظت إحدى المهندسات أن الحل الذي يمتص طاقة أكبر ليس بالضرورة الأفضل في جميع التطبيقات؛ إذ قد يكون ملامسة الشحنة لدرجات قريبة من 0°C غير مقبولة. ولذلك يتطلب القرار الهندسي الجمع بين الحسابات وحدود التشغيل الآمن.`],table:[['الخيار','الكتلة','درجة البداية','درجة النهاية'],['أ: ماء','0.50 kg','0°C','10°C'],['ب: ثلج ثم ماء','0.50 kg','0°C','10°C']],qs:[['حساب','ما الطاقة التي يمتصها الخيار أ؟','0.50×4200×10=21000 J.'],['حساب مركب','ما الطاقة التي يمتصها الخيار ب؟','0.50×334000+0.50×4200×10=188000 J.'],['مقارنة','كم يزيد امتصاص الخيار ب على الخيار أ؟','167000 J.'],['استدلال','ما دور الحرارة الكامنة في تفوق الخيار ب حسابيًا؟','تسمح بامتصاص 167000 J أثناء الانصهار قبل ارتفاع حرارة الماء.'],['تفكير ناقد','هل يمكن اعتماد الخيار ب دون معرفة الحد الأدنى المسموح لحرارة الشحنة؟','لا؛ قد يؤدي التبريد المفرط إلى تلف مادة حساسة للبرودة.'],['تقييم','ما المعلومات الناقصة لاتخاذ قرار هندسي موثوق؟','المدى الحراري الآمن، مدة النقل، معدل التسرب الحراري، توزيع الحرارة، ونوع العزل.'],['تنبؤ','إذا تضاعفت كتلة الثلج وبقيت الظروف الأخرى ثابتة، ماذا يحدث لقدرة امتصاص الطاقة؟','تتضاعف الطاقة المحسوبة للوصول إلى درجة النهاية نفسها.'],['ابتكار','اقترحي خطة مراقبة تحمي الشحنة من السخونة والبرودة المفرطة.','حافظة معزولة مع فاصل حراري ومستشعرات وإنذار للحدين الأعلى والأدنى وتسجيل دوري.']]}];

function table(u){return `<table class="data">${u.table.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>`}
function pageHTML(p){
 if(p.kind==='cover')return `<section class="page cover"><div class="cover-photo"></div><div class="cover-shade"></div><div class="cover-content"><div class="cover-edition">مجلة علمية تفاعلية • إصدار 2026 / 2027</div><div class="cover-main"><div class="cover-rule"></div><div class="cover-small">رحلة علمية في عالم الطاقة والتغيرات الحرارية</div><h1>ما وراء<br>الحرارة</h1><p>اقرئي • استقصي • حلّلي • استنتجي</p></div><div class="cover-credit">إعداد المعلمة <strong>حفصة طيبي</strong><br>الصف العاشر | قسم الفيزياء</div></div><button class="cover-open" onclick="go(1)">افتحي المجلة ←</button></section>`;
 if(p.kind==='registration')return `<section class="page finish"><div class="kicker">الخطوة الأولى • بيانات الطالبة</div><h2>بطاقة الدخول إلى التحقيقات</h2><p>يجب تعبئة جميع الحقول قبل بدء النشاط.</p><form class="student-form" onsubmit="event.preventDefault();registerStudent()"><label>الاسم الثلاثي الكامل<input id="studentName" required placeholder="الاسم الأول واسم الأب واسم العائلة" value="${esc(student.name)}"></label><label>الصف<input id="studentGrade" required value="${esc(student.grade)}"></label><label>الشعبة<input id="studentSection" required placeholder="مثال: عاشر 4" value="${esc(student.section)}"></label><button class="action" type="submit">حفظ البيانات وفتح فهرس المجلة</button></form></section>`;
 if(p.kind==='home')return `<section class="page home"><div class="kicker">مجلة علمية تفاعلية • 2026 / 2027</div><div class="homehead"><div><h1>ما وراء الحرارة</h1><p>ستة تحقيقات فيزيائية مستوحاة من مواقف الحياة • اختاري ملفًا لبدء القراءة والتحليل</p></div><div class="kicker">إعداد المعلمة حفصة طيبي<br>الصف العاشر • قسم الفيزياء</div></div><div class="tiles">${units.map((u,i)=>`<button class="tile" onclick="openUnit(${i})">${photo(u.img,u.title)}<div class="caption"><small>التحقيق ${i+1} من 6</small><strong>${u.title}</strong></div></button>`).join('')}</div><div class="kicker">اقرئي النص، حلّلي الأدلة، ثم اختاري إجابتك • لا تُعرض الحلول</div></section>`;
 const u=units[p.u];
 if(p.kind==='read'){const paras=u.paragraphs.slice(p.part*2,p.part*2+2);return `<section class="page"><div class="kicker">التحقيق ${p.u+1} • ${p.part?'الأدلة والبيانات':'القصة العلمية'}</div><h2>${u.title}</h2><div class="readbody">${p.part?`<div class="story">${paras.map(t=>`<p>${esc(t)}</p>`).join('')}${table(u)}</div>${photo(u.img,u.sub)}`:`${photo(u.img,u.sub)}<div class="story">${paras.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`}</div><div class="kicker">اسحبي زاوية الصفحة أو استخدمي زر الصفحة التالية</div></section>`}
 if(p.kind==='finish')return finished(p.u);
 const q=p.q, item=u.qs[q], isEssay=q>=6, key=`${p.u}-${q}`,law=lawBank[key];
 const lawHTML=law?`<div class="kicker">قبل حل المسألة: أي قانون تختارين؟</div><div class="options" style="flex:0 1 auto">${law.slice(0,4).map((v,k)=>`<button class="option" data-group="law-${key}" data-value="${k}" onclick="choose(this)"><b>${'ABCD'[k]}</b>${esc(v)}</button>`).join('')}</div>`:'';
 const options=!isEssay?`<div class="options">${choiceBank[p.u][q].slice(0,4).map((v,k)=>`<button class="option" data-group="answer-${key}" data-value="${k}" onclick="choose(this)"><b>${'ABCD'[k]}</b>${esc(v)}</button>`).join('')}</div>`:`<textarea class="essay" data-write="${key}" placeholder="اكتبي إجابتكِ هنا، وفسّري رأيكِ بالأدلة العلمية..." oninput="saveWrite(this)"></textarea>`;
 return `<section class="page"><div class="qhead"><div class="kicker">التحقيق ${p.u+1} • السؤال ${q+1} من 8</div><div class="kicker">${isEssay?'إجابة مقالية':'اختيار من متعدد'}</div></div><h2>${esc(item[0])}</h2><div class="prompt">${esc(item[1])}</div>${lawHTML}${options}<div class="qfooter"><button class="action" onclick="reread(${p.u})">اقرئي النص مرة أخرى</button><span class="kicker">لا تُعرض الإجابات الصحيحة</span></div></section>`;
}
function show(){book.innerHTML=pageHTML(pages[current]);const pg=book.querySelector('.page');pg.classList.add('active');document.getElementById('counter').textContent=`${current===0?'الغلاف':current===1?'بيانات الطالبة':current===2?'الفهرس':pages[current].kind==='question'?`سؤال ${pages[current].q+1} / 8`:'التحقيق '+(pages[current].u+1)}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=pages[current].kind==='finish'||current===1;document.querySelectorAll('[data-group]').forEach(el=>{if(chosen[el.dataset.group]===el.dataset.value)el.classList.add('selected')});document.querySelectorAll('[data-write]').forEach(el=>{try{el.value=localStorage.getItem('heatessay-'+el.dataset.write)||''}catch(e){}});const corner=document.createElement('div');corner.className='corner';corner.addEventListener('pointerdown',startDrag);book.appendChild(corner);}
function choose(el){const group=el.dataset.group;chosen[group]=el.dataset.value;document.querySelectorAll('[data-group="'+group+'"]').forEach(x=>x.classList.toggle('selected',x===el));try{localStorage.setItem('heatselect-'+group,el.dataset.value)}catch(e){}}
function saveWrite(el){try{localStorage.setItem('heatessay-'+el.dataset.write,el.value)}catch(e){}}
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('heatselect-'))chosen[k.slice(11)]=localStorage.getItem(k)}}catch(e){}
function go(n){if(busy||n<0||n>=pages.length||n===current)return;const p=pages[current];if(current>2&&n>2){if(n<starts[p.u]||n>ends[p.u])return;}busy=true;const forward=n>current;const flip=document.createElement('div');flip.className='flip on';book.appendChild(flip);const old=book.querySelector('.page');old.style.transition='transform .65s cubic-bezier(.2,.7,.2,1),opacity .65s';old.style.transform=`rotateY(${forward?-165:165}deg) rotateX(${forward?4:-4}deg)`;old.style.opacity='.3';flip.animate([{transform:'rotateY(0deg) skewY(0deg)'},{transform:`rotateY(${forward?-170:170}deg) skewY(${forward?-3:3}deg)`}],{duration:650,easing:'cubic-bezier(.2,.7,.2,1)'});setTimeout(()=>{current=n;busy=false;show()},650)}
function openUnit(i){if(!studentReady()){alert('أكملي بيانات الطالبة أولًا');go(1);return}go(starts[i])}
function step(dir){if(current===0&&dir<0)return;if(current===1&&dir>0){registerStudent();return}go(current+dir)}
function reread(i){const u=units[i];document.getElementById('modalTitle').textContent=u.title;document.getElementById('modalBody').innerHTML=u.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')+table(u);document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
function startDrag(e){if(pages[current].kind==='finish')return;e.preventDefault();drag={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId);const fl=document.createElement('div');fl.className='flip on';fl.id='dragflip';book.appendChild(fl);e.currentTarget.addEventListener('pointermove',moveDrag);e.currentTarget.addEventListener('pointerup',endDrag,{once:true})}
function moveDrag(e){if(!drag)return;const dx=drag.x-e.clientX;const dy=drag.y-e.clientY;const angle=Math.max(-160,Math.min(0,-dx/Math.max(120,book.clientWidth)*210));const fl=document.getElementById('dragflip');if(fl)fl.style.transform=`rotateY(${angle}deg) rotateX(${Math.max(-12,Math.min(12,dy/14))}deg)`;book.style.transform=`rotateX(${2+Math.min(7,Math.abs(dy)/50)}deg) rotateY(${Math.min(7,Math.abs(dx)/65)}deg)`}
function endDrag(e){if(!drag)return;const dx=drag.x-e.clientX;drag=null;const fl=document.getElementById('dragflip');if(fl)fl.remove();book.style.transform='rotateX(2deg)';if(dx>Math.min(95,book.clientWidth*.14))step(1)}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
show();
</script></body></html>
